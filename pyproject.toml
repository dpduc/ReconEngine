[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-engine"
version = "0.1.0"
description = "Automated 3-way reconciliation engine (OMS / Bank / 3PL)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "pre-commit>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
extend-exclude = [".claude"]

[tool.ruff.lint]
# Rules that catch bugs, not style: pyflakes, pycodestyle errors, bugbear.
select = ["E4", "E7", "E9", "F", "B"]
# zip(strict=True) would change runtime behaviour on every call site.
ignore = ["B905"]
per-file-ignores = {"tests/*" = ["E731"]}

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["recon.perf.CostModel", "recon.channeldata.VietnamAssumptions"]
