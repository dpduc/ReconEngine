[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-engine"
version = "0.1.0"
description = "Automated 3-way reconciliation engine (OMS / Bank / 3PL)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
